# rsconstruct build configuration for this repository.

[build]

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["exercises"]

[processor.zspell]
src_dirs = ["exercises"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["scripts", "exercises"]

[processor.pylint]
src_dirs = ["scripts", "exercises"]

[processor.mypy]
src_dirs = ["scripts", "exercises"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts", "exercises"]
args = ["--severity=error", "--shell=bash"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# ─── repo-specific configuration ────────────────────────────────────────────

# Run every exercise's solution.sh against its input.json and require that the
# result matches the committed output.json. The script processor discovers one
# product per solution.sh, so exercises are checked in parallel and only the
# exercises whose files actually changed are re-run on an incremental build.
[processor.script.solutions]
enabled = true
command = "scripts/test_solution.py"
src_extensions = [".sh"]
src_dirs = ["exercises"]
# solution.sh is the only scanned input, so the json files must be declared
# explicitly — otherwise editing an input.json or output.json alone would leave
# a stale cached pass.
dep_inputs = ["exercises/*/input.json", "exercises/*/output.json"]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
